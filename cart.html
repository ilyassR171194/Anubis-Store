<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة التسوق | متجر أنوبيس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><h1>🐺 متجر أنوبيس</h1></div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="cart.html">السلة 🛒 <span id="cartCount">0</span></a>
            <a href="login.html" id="loginBtn">تسجيل الدخول</a>
        </nav>
    </header>

    <main>
        <section class="products">
            <h3>سلة التسوق</h3>
            <div id="cartContainer" class="product-grid">
                <!-- سيتم عرض المنتجات هنا -->
            </div>
            <div id="cartTotal" style="text-align: center; margin-top: 2rem; font-size: 1.5rem; color: #f39c12; font-weight: 700;"></div>
            <div style="text-align: center; margin-top: 1rem;">
                <button id="checkoutBtn" style="max-width: 300px; margin: 0 auto;">إتمام الطلب</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Anubis Store. جميع الحقوق محفوظة.</p>
    </footer>

    <script type="module">
        import { getCart, removeFromCart, updateCartCount } from './cart.js';

        const cartContainer = document.getElementById('cartContainer');
        const cartTotal = document.getElementById('cartTotal');

        function renderCart() {
            const cart = getCart();
            cartContainer.innerHTML = '';
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="text-align: center; width: 100%;">السلة فارغة. أضف بعض المنتجات!</p>';
                cartTotal.textContent = '';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemHTML = `
                    <div class="product-card">
                        <img src="${item.image}" alt="${item.name}">
                        <h4>${item.name}</h4>
                        <p>${item.price} $ × ${item.quantity}</p>
                        <button onclick="window.removeItem('${item.id}')" style="background-color: #e74c3c;">إزالة</button>
                    </div>
                `;
                cartContainer.innerHTML += itemHTML;
            });
            cartTotal.textContent = `الإجمالي: ${total} $`;
        }

        // دالة الإزالة (يجب أن تكون عامة ليتم استدعاؤها من onclick)
        window.removeItem = (id) => {
            removeFromCart(id);
            renderCart();
        };

        // دالة إتمام الطلب
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const cart = getCart();
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            window.location.href = 'checkout.html';
        });

        renderCart();
        updateCartCount();
    </script>
</body>
</html>
