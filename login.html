<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | متجر أنوبيس</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container { max-width: 400px; margin: 4rem auto; padding: 2rem; background-color: #1a1a1a; border-radius: 12px; border: 1px solid #333; text-align: center; }
        .login-container h2 { margin-bottom: 2rem; color: #f39c12; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #444; background-color: #222; color: #fff; font-family: 'Cairo', sans-serif; }
        .login-btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; font-family: 'Cairo', sans-serif; transition: opacity 0.3s; background-color: #f39c12; color: #000; margin-bottom: 1rem; }
        .login-btn:hover { opacity: 0.9; }
        .toggle-link { color: #f39c12; cursor: pointer; text-decoration: underline; margin-top: 1rem; display: block; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>🐺 متجر أنوبيس</h1></div>
        <nav><a href="index.html">الرئيسية</a></nav>
    </header>

    <main>
        <div class="login-container">
            <h2 id="formTitle">تسجيل الدخول</h2>
            <input type="email" id="email" class="login-input" placeholder="البريد الإلكتروني">
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور">
            <button id="submitBtn" class="login-btn">دخول</button>
            <span id="toggleForm" class="toggle-link">ليس لديك حساب؟ سجل الآن</span>
        </div>
    </main>

    <script type="module">
        import { auth } from './firebase.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let isLoginMode = true;
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleForm = document.getElementById('toggleForm');

        // التبديل بين تسجيل الدخول وإنشاء حساب
        toggleForm.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'تسجيل الدخول';
                submitBtn.textContent = 'دخول';
                toggleForm.textContent = 'ليس لديك حساب؟ سجل الآن';
            } else {
                formTitle.textContent = 'إنشاء حساب جديد';
                submitBtn.textContent = 'تسجيل';
                toggleForm.textContent = 'لديك حساب بالفعل؟ سجل دخولك';
            }
        });

        // تنفيذ تسجيل الدخول أو إنشاء الحساب
        submitBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور.');
                return;
            }

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = 'index.html';
            } catch (error) {
                console.error("خطأ:", error);
                alert("فشل العملية: " + error.message);
            }
        });

        // التحقق من حالة المستخدم
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
